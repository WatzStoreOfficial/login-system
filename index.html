<!DOCTYPE html>
<html>
<head>
  <title>Sign Up & Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    .toggle {
      text-align: center;
      margin-top: 10px;
      cursor: pointer;
      color: blue;
    }
    #message {
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="formTitle">Sign Up</h2>
    <form id="authForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Submit</button>
    </form>
    <p id="message"></p>
    <div class="toggle" onclick="toggleForm()">Already have an account? Login</div>
  </div>

  <script>
    let isLogin = false;
    const users = {}; // Temporary storage (in-memory)

    function toggleForm() {
      isLogin = !isLogin;
      document.getElementById("formTitle").innerText = isLogin ? "Login" : "Sign Up";
      document.querySelector(".toggle").innerText = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login";
      document.getElementById("message").innerText = "";
    }

    document.getElementById("authForm").addEventListener("submit", function(event){
      event.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if(isLogin){
        // Login check
        if(users[username] && users[username] === password){
          document.getElementById("message").innerText = "Login successful!";
          document.getElementById("message").style.color = "green";
        } else {
          document.getElementById("message").innerText = "Invalid username or password.";
          document.getElementById("message").style.color = "red";
        }
      } else {
        // Sign up
        if(users[username]){
          document.getElementById("message").innerText = "Username already exists.";
          document.getElementById("message").style.color = "red";
        } else {
          users[username] = password;
          document.getElementById("message").innerText = "Sign up successful! You can now login.";
          document.getElementById("message").style.color = "green";
          toggleForm(); // Switch to login form
        }
      }
    });
  </script>
</body>
</html>
